# 公共配置文件
# @author <a href="https://github.com/likatomegumi">程序员鱼皮</a>
# @from <a href="https://katomegumi.icu">编程导航知识星球</a>
spring:
  application:
    name: zxoj-backend-user-service
  # session 配置
  session:
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.88.133:3306/zxoj
    username: root
    password: 123456
  # Redis 配置
  # todo 需替换配置，然后取消注释
  redis:
    database: 1
    host: 192.168.88.133
    port: 6379
    timeout: 5000
    password: 123456
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  cloud:
      nacos:
        discovery:
          server-addr: 127.0.0.1:8848
server:
  port: 8101
  servlet:
    context-path: /api/user
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.katomegumi.zxojbackenduserservice.controller
# 用户可以自由选择
codeSandBox:
  type: remote
